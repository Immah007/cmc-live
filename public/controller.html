<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broadcast Control Panel</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .panel h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel h2 .icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .icon-lower-third {
            background: linear-gradient(135deg, #fbad18, #f97316);
        }

        .icon-scripture {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
        }

        .icon-speaker {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #fbad18;
            box-shadow: 0 0 0 3px rgba(251, 173, 24, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .scroll-messages {
            margin-top: 20px;
        }

        .scroll-messages h3 {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 10px;
        }

        .message-item {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }

        .message-item input {
            flex: 1;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-add {
            background: rgba(52, 211, 153, 0.2);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.3);
        }

        .btn-add:hover {
            background: rgba(52, 211, 153, 0.3);
        }

        .btn-remove {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 10px;
        }

        .btn-remove:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .btn-update {
            background: linear-gradient(135deg, #fbad18, #f97316);
            color: #000;
            font-weight: 600;
        }

        .btn-update:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(251, 173, 24, 0.4);
        }

        .btn-show {
            background: linear-gradient(135deg, #34d399, #10b981);
            color: #000;
            font-weight: 600;
        }

        .btn-show:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(52, 211, 153, 0.4);
        }

        .btn-show.active {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
        }

        .btn-show.active:hover {
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .select-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .preview-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
            min-height: 80px;
        }

        .preview-box .verse-ref {
            color: #FFD700;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .preview-box .verse-text {
            color: #e0e0e0;
            font-size: 16px;
            line-height: 1.5;
            font-style: italic;
        }

        .preview-box .speaker-role {
            color: #fbad18;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .preview-box .speaker-name {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-active {
            background: #34d399;
            box-shadow: 0 0 8px rgba(52, 211, 153, 0.6);
        }

        .status-inactive {
            background: #6b7280;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            .select-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Lower Third Control Panel -->
        <div class="panel">
            <h2>
                <span class="icon icon-lower-third">📺</span>
                Main Lower Third
            </h2>
            <div class="form-group">
                <label>Heading (Small Bar)</label>
                <input type="text" id="ltHeading" value="Repentance & Holiness" placeholder="Enter heading...">
            </div>
            <div class="form-group">
                <label>Headline (White Bar)</label>
                <input type="text" id="ltHeadline" value="CITY MEGA CHURCH SUNDAY SERVICE" placeholder="Enter headline...">
            </div>
            
            <div class="scroll-messages">
                <h3>Scrolling Messages</h3>
                <div id="scrollMessagesList">
                    <div class="message-item">
                        <input type="text" value="For more information please contact Bishop Dr.JJ on 0700727435" placeholder="Enter message...">
                        <button class="btn btn-remove btn-sm" onclick="removeMessage(this)">✕</button>
                    </div>
                    <div class="message-item">
                        <input type="text" value="repentandpreparetheway.org" placeholder="Enter message...">
                        <button class="btn btn-remove btn-sm" onclick="removeMessage(this)">✕</button>
                    </div>
                    <div class="message-item">
                        <input type="text" value="City Mega Church Livestream" placeholder="Enter message...">
                        <button class="btn btn-remove btn-sm" onclick="removeMessage(this)">✕</button>
                    </div>
                </div>
                <button class="btn btn-add btn-sm" onclick="addMessage()" style="margin-top: 8px;">+ Add Message</button>
            </div>

            <div class="button-group">
                <button class="btn btn-update" onclick="updateLowerThird()">
                    📝 Update & Show
                </button>
                <button class="btn btn-show" id="ltToggleBtn" onclick="toggleLowerThird()">
                    👁️ Show/Hide
                </button>
            </div>
        </div>

        <!-- Scripture Control Panel -->
        <div class="panel">
            <h2>
                <span class="icon icon-scripture">📖</span>
                Scripture Display
            </h2>
            <div class="select-group">
                <div class="form-group">
                    <label>Version</label>
                    <select id="scriptureVersion" onchange="onVersionChange()">
                        <option value="john">John (NIV)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Chapter</label>
                    <select id="scriptureChapter" onchange="onChapterChange()">
                        <option value="3">Chapter 3</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Verse</label>
                    <select id="scriptureVerse" onchange="onVerseChange()">
                        <option value="15">Verse 15</option>
                        <option value="16">Verse 16</option>
                        <option value="17">Verse 17</option>
                    </select>
                </div>
            </div>

            <div class="preview-box" id="scripturePreview">
                <div class="verse-ref">John 3:16</div>
                <div class="verse-text">For God so loved the world that he gave his one and only Son, that whoever believes in him shall not perish but have eternal life.</div>
            </div>

            <div class="button-group">
                <button class="btn btn-show" id="scriptureToggleBtn" onclick="toggleScripture()">
                    📖 Show Scripture
                </button>
            </div>
        </div>

        <!-- Speaker Control Panel -->
        <div class="panel">
            <h2>
                <span class="icon icon-speaker">🎤</span>
                Speaker Display
            </h2>
            <div class="form-group">
                <label>Role / Title</label>
                <input type="text" id="speakerRole" value="NOW MINISTERING" placeholder="Enter role...">
            </div>
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="speakerName" value="Bishop Jason" placeholder="Enter name...">
            </div>

            <div class="preview-box" id="speakerPreview">
                <div class="speaker-role">NOW MINISTERING</div>
                <div class="speaker-name">Bishop Jason</div>
            </div>

            <div class="button-group">
                <button class="btn btn-show" id="speakerToggleBtn" onclick="toggleSpeaker()">
                    🎤 Show Speaker
                </button>
            </div>
        </div>
    </div>

    <script>
        // ========== SOCKET.IO CONNECTION ==========
        const socket = io('http://localhost:3000');
        
        socket.on('connect', () => {
            console.log('Connected to broadcast server');
        });

        socket.on('disconnect', () => {
            console.log('Disconnected from broadcast server');
        });

        // ========== SCRIPTURE DATA ==========
        const scriptureData = {
            john: {
                3: {
                    15: "That whoever believes in him may have eternal life.",
                    16: "For God so loved the world that he gave his one and only Son, that whoever believes in him shall not perish but have eternal life.",
                    17: "For God did not send his Son into the world to condemn the world, but to save the world through him."
                }
            }
        };

        // ========== LOWER THIRD CONTROLS ==========
        function addMessage() {
            const list = document.getElementById('scrollMessagesList');
            const newItem = document.createElement('div');
            newItem.className = 'message-item';
            newItem.innerHTML = `
                <input type="text" value="" placeholder="Enter message...">
                <button class="btn btn-remove btn-sm" onclick="removeMessage(this)">✕</button>
            `;
            list.appendChild(newItem);
        }

        function removeMessage(btn) {
            const item = btn.parentElement;
            if (document.querySelectorAll('.message-item').length > 1) {
                item.remove();
            }
        }

        function getScrollMessages() {
            const inputs = document.querySelectorAll('#scrollMessagesList input');
            return Array.from(inputs).map(input => input.value.trim()).filter(v => v);
        }

        function updateLowerThird() {
            const heading = document.getElementById('ltHeading').value;
            const headline = document.getElementById('ltHeadline').value;
            const scrollMessages = getScrollMessages();

            socket.emit('updateLowerThird', {
                heading: heading,
                headline: headline,
                scrollMessages: scrollMessages
            });

            // Auto show when updated
            const toggleBtn = document.getElementById('ltToggleBtn');
            if (!toggleBtn.classList.contains('active')) {
                toggleBtn.classList.add('active');
                toggleBtn.textContent = '👁️ Hide';
            }
        }

        function toggleLowerThird() {
            const btn = document.getElementById('ltToggleBtn');
            const isActive = btn.classList.contains('active');

            if (isActive) {
                socket.emit('hideLowerThird');
                btn.classList.remove('active');
                btn.textContent = '👁️ Show';
            } else {
                // Update with current values before showing
                updateLowerThird();
                btn.classList.add('active');
                btn.textContent = '👁️ Hide';
            }
        }

        // ========== SCRIPTURE CONTROLS ==========
        function onVersionChange() {
            const version = document.getElementById('scriptureVersion').value;
            const chapterSelect = document.getElementById('scriptureChapter');
            
            // Clear and repopulate chapters
            chapterSelect.innerHTML = '';
            if (scriptureData[version]) {
                Object.keys(scriptureData[version]).forEach(chapter => {
                    const option = document.createElement('option');
                    option.value = chapter;
                    option.textContent = `Chapter ${chapter}`;
                    chapterSelect.appendChild(option);
                });
            }
            
            onChapterChange();
        }

        function onChapterChange() {
            const version = document.getElementById('scriptureVersion').value;
            const chapter = document.getElementById('scriptureChapter').value;
            const verseSelect = document.getElementById('scriptureVerse');
            
            verseSelect.innerHTML = '';
            if (scriptureData[version] && scriptureData[version][chapter]) {
                Object.keys(scriptureData[version][chapter]).forEach(verse => {
                    const option = document.createElement('option');
                    option.value = verse;
                    option.textContent = `Verse ${verse}`;
                    verseSelect.appendChild(option);
                });
            }
            
            onVerseChange();
        }

        function onVerseChange() {
            const version = document.getElementById('scriptureVersion').value;
            const chapter = document.getElementById('scriptureChapter').value;
            const verse = document.getElementById('scriptureVerse').value;
            
            updateScripturePreview(version, chapter, verse);
        }

        function updateScripturePreview(version, chapter, verse) {
            const preview = document.getElementById('scripturePreview');
            const refEl = preview.querySelector('.verse-ref');
            const textEl = preview.querySelector('.verse-text');
            
            const versionNames = { john: 'John' };
            const versionName = versionNames[version] || version;
            refEl.textContent = `${versionName} ${chapter}:${verse}`;
            
            if (scriptureData[version] && scriptureData[version][chapter] && scriptureData[version][chapter][verse]) {
                textEl.textContent = scriptureData[version][chapter][verse];
            } else {
                textEl.textContent = 'Select a verse to preview';
            }
        }

        function toggleScripture() {
            const btn = document.getElementById('scriptureToggleBtn');
            const isActive = btn.classList.contains('active');

            if (isActive) {
                socket.emit('hideScripture');
                btn.classList.remove('active');
                btn.textContent = '📖 Show Scripture';
            } else {
                const version = document.getElementById('scriptureVersion').value;
                const chapter = document.getElementById('scriptureChapter').value;
                const verse = document.getElementById('scriptureVerse').value;
                
                const versionNames = { john: 'John' };
                const versionName = versionNames[version] || version;
                
                socket.emit('showScripture', {
                    ref: `${versionName} ${chapter}:${verse}`,
                    text: scriptureData[version][chapter][verse]
                });

                btn.classList.add('active');
                btn.textContent = '📖 Hide Scripture';
            }
        }

        // ========== SPEAKER CONTROLS ==========
        function updateSpeakerPreview() {
            const role = document.getElementById('speakerRole').value;
            const name = document.getElementById('speakerName').value;
            
            const preview = document.getElementById('speakerPreview');
            preview.querySelector('.speaker-role').textContent = role || 'NOW MINISTERING';
            preview.querySelector('.speaker-name').textContent = name || 'Speaker Name';
        }

        // Live preview update
        document.getElementById('speakerRole').addEventListener('input', updateSpeakerPreview);
        document.getElementById('speakerName').addEventListener('input', updateSpeakerPreview);

        function toggleSpeaker() {
            const btn = document.getElementById('speakerToggleBtn');
            const isActive = btn.classList.contains('active');

            if (isActive) {
                socket.emit('hideSpeaker');
                btn.classList.remove('active');
                btn.textContent = '🎤 Show Speaker';
            } else {
                const role = document.getElementById('speakerRole').value;
                const name = document.getElementById('speakerName').value;
                
                socket.emit('showSpeaker', {
                    role: role,
                    name: name
                });

                btn.classList.add('active');
                btn.textContent = '🎤 Hide Speaker';
            }
        }

        // ========== SOCKET EVENT LISTENERS ==========
        socket.on('speakerAutoHidden', () => {
            const btn = document.getElementById('speakerToggleBtn');
            btn.classList.remove('active');
            btn.textContent = '🎤 Show Speaker';
        });

        socket.on('lowerThirdHidden', () => {
            const btn = document.getElementById('ltToggleBtn');
            btn.classList.remove('active');
            btn.textContent = '👁️ Show';
        });

        socket.on('scriptureHidden', () => {
            const btn = document.getElementById('scriptureToggleBtn');
            btn.classList.remove('active');
            btn.textContent = '📖 Show Scripture';
        });

        // Initialize previews
        updateScripturePreview('john', '3', '16');
        updateSpeakerPreview();
    </script>
</body>
</html>
