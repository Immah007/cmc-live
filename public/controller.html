<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broadcast Control Panel</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #fbad18;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            margin-top: 20px;
            font-size: 18px;
            color: #ffffff;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .panel h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel h2 .icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .icon-lower-third {
            background: linear-gradient(135deg, #fbad18, #f97316);
        }

        .icon-scripture {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
        }

        .icon-speaker {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #fbad18;
            box-shadow: 0 0 0 3px rgba(251, 173, 24, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .scroll-messages {
            margin-top: 20px;
        }

        .scroll-messages h3 {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 10px;
        }

        .message-item {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }

        .message-item input {
            flex: 1;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-add {
            background: rgba(52, 211, 153, 0.2);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.3);
        }

        .btn-add:hover {
            background: rgba(52, 211, 153, 0.3);
        }

        .btn-remove {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 10px;
        }

        .btn-remove:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .btn-update {
            background: linear-gradient(135deg, #fbad18, #f97316);
            color: #000;
            font-weight: 600;
        }

        .btn-update:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(251, 173, 24, 0.4);
        }

        .btn-show {
            background: linear-gradient(135deg, #34d399, #10b981);
            color: #000;
            font-weight: 600;
        }

        .btn-show:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(52, 211, 153, 0.4);
        }

        .btn-show.active {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
        }

        .btn-show.active:hover {
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }

        .btn-nav {
            background: rgba(139, 92, 246, 0.2);
            color: #8b5cf6;
            border: 1px solid rgba(139, 92, 246, 0.3);
            font-size: 16px;
        }

        .btn-nav:hover {
            background: rgba(139, 92, 246, 0.3);
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .select-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .nav-group {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
        }

        .verse-indicator {
            text-align: center;
            color: #a0aec0;
            font-size: 14px;
            min-width: 80px;
        }

        .preview-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
            min-height: 80px;
        }

        .preview-box .verse-ref {
            color: #FFD700;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .preview-box .verse-text {
            color: #e0e0e0;
            font-size: 16px;
            line-height: 1.5;
            font-style: italic;
        }

        .preview-box .speaker-role {
            color: #fbad18;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .preview-box .speaker-name {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            .select-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading Bible Data...</div>
    </div>

    <div class="container">
        <!-- Lower Third Control Panel -->
        <div class="panel">
            <h2>
                <span class="icon icon-lower-third">📺</span>
                Main Lower Third
            </h2>
            <div class="form-group">
                <label>Heading (Small Bar)</label>
                <input type="text" id="ltHeading" value="Repentance & Holiness" placeholder="Enter heading...">
            </div>
            <div class="form-group">
                <label>Headline (White Bar)</label>
                <input type="text" id="ltHeadline" value="CITY MEGA CHURCH SUNDAY SERVICE" placeholder="Enter headline...">
            </div>
            
            <div class="scroll-messages">
                <h3>Scrolling Messages</h3>
                <div id="scrollMessagesList">
                    <div class="message-item">
                        <input type="text" value="For more information please contact Bishop Dr.JJ on 0700727435" placeholder="Enter message...">
                        <button class="btn btn-remove btn-sm" onclick="removeMessage(this)">✕</button>
                    </div>
                    <div class="message-item">
                        <input type="text" value="repentandpreparetheway.org" placeholder="Enter message...">
                        <button class="btn btn-remove btn-sm" onclick="removeMessage(this)">✕</button>
                    </div>
                    <div class="message-item">
                        <input type="text" value="City Mega Church Livestream" placeholder="Enter message...">
                        <button class="btn btn-remove btn-sm" onclick="removeMessage(this)">✕</button>
                    </div>
                </div>
                <button class="btn btn-add btn-sm" onclick="addMessage()" style="margin-top: 8px;">+ Add Message</button>
            </div>

            <div class="button-group">
                <button class="btn btn-update" onclick="updateLowerThird()">
                    📝 Update & Show
                </button>
                <button class="btn btn-show" id="ltToggleBtn" onclick="toggleLowerThird()">
                    👁️ Hide
                </button>
            </div>
        </div>

        <!-- Scripture Control Panel -->
        <div class="panel">
            <h2>
                <span class="icon icon-scripture">📖</span>
                Scripture Display
            </h2>
            <div class="select-group">
                <div class="form-group">
                    <label>Book</label>
                    <select id="scriptureBook" onchange="onBookChange()">
                        <option value="">Loading...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Chapter</label>
                    <select id="scriptureChapter" onchange="onChapterChange()">
                        <option value="">Select chapter</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Verse</label>
                    <select id="scriptureVerse" onchange="onVerseChange()">
                        <option value="">Select verse</option>
                    </select>
                </div>
            </div>

            <div class="nav-group">
                <button class="btn btn-nav" onclick="previousVerse()" title="Previous Verse">◀ Prev</button>
                <span class="verse-indicator" id="verseIndicator">-</span>
                <button class="btn btn-nav" onclick="nextVerse()" title="Next Verse">Next ▶</button>
            </div>

            <div class="preview-box" id="scripturePreview">
                <div class="verse-ref">Select a verse</div>
                <div class="verse-text">Choose a book, chapter, and verse to preview</div>
            </div>

            <div class="button-group">
                <button class="btn btn-show" id="scriptureToggleBtn" onclick="toggleScripture()">
                    📖 Show Scripture
                </button>
            </div>
        </div>

        <!-- Speaker Control Panel -->
        <div class="panel">
            <h2>
                <span class="icon icon-speaker">🎤</span>
                Speaker Display
            </h2>
            <div class="form-group">
                <label>Role / Title</label>
                <input type="text" id="speakerRole" value="NOW MINISTERING" placeholder="Enter role...">
            </div>
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="speakerName" value="Bishop Jason" placeholder="Enter name...">
            </div>

            <div class="preview-box" id="speakerPreview">
                <div class="speaker-role">NOW MINISTERING</div>
                <div class="speaker-name">Bishop Jason</div>
            </div>

            <div class="button-group">
                <button class="btn btn-show" id="speakerToggleBtn" onclick="toggleSpeaker()">
                    🎤 Show Speaker
                </button>
            </div>
        </div>
    </div>

    <script>
        // ========== SOCKET.IO CONNECTION ==========
        const socket = io();

        // ========== BIBLE DATA STORE ==========
        let bibleData = null;
        let currentBookIndex = 0;
        let currentChapterIndex = 0;
        let currentVerseIndex = 0;

        // ========== LOADING ==========
        async function loadBibleData() {
            try {
                const response = await fetch('/api/bible');
                if (!response.ok) {
                    throw new Error('Failed to fetch Bible data');
                }
                bibleData = await response.json();
                console.log('📖 Bible data loaded:', bibleData.name);
                
                // Populate book dropdown
                populateBooks();
                
                // Hide loading overlay
                document.getElementById('loadingOverlay').style.display = 'none';
            } catch (error) {
                console.error('❌ Error loading Bible data:', error);
                document.querySelector('.loading-text').textContent = 'Error loading Bible data. Please refresh.';
            }
        }

        function populateBooks() {
            const bookSelect = document.getElementById('scriptureBook');
            bookSelect.innerHTML = '';
            
            if (!bibleData || !bibleData.books) return;
            
            bibleData.books.forEach((book, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${book.englishName} (${book.book})`;
                bookSelect.appendChild(option);
            });
            
            // Set default to John (usually index 42)
            const johnIndex = bibleData.books.findIndex(b => b.book === 'John');
            if (johnIndex >= 0) {
                bookSelect.value = johnIndex;
                currentBookIndex = johnIndex;
                onBookChange();
            }
        }

        // ========== SCRIPTURE NAVIGATION ==========
        function onBookChange() {
            const bookSelect = document.getElementById('scriptureBook');
            const chapterSelect = document.getElementById('scriptureChapter');
            const verseSelect = document.getElementById('scriptureVerse');
            
            currentBookIndex = parseInt(bookSelect.value);
            chapterSelect.innerHTML = '';
            verseSelect.innerHTML = '<option value="">Select verse</option>';
            
            if (isNaN(currentBookIndex) || !bibleData) return;
            
            const book = bibleData.books[currentBookIndex];
            book.chapters.forEach((chapter, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `Chapter ${chapter.chapter}`;
                chapterSelect.appendChild(option);
            });
            
            // Default to chapter 3 if available
            const chapter3Index = book.chapters.findIndex(c => c.chapter === 3);
            if (chapter3Index >= 0) {
                chapterSelect.value = chapter3Index;
                currentChapterIndex = chapter3Index;
            } else {
                chapterSelect.value = 0;
                currentChapterIndex = 0;
            }
            
            onChapterChange();
        }

        function onChapterChange() {
            const chapterSelect = document.getElementById('scriptureChapter');
            const verseSelect = document.getElementById('scriptureVerse');
            
            currentChapterIndex = parseInt(chapterSelect.value);
            verseSelect.innerHTML = '';
            
            if (isNaN(currentChapterIndex) || !bibleData) return;
            
            const book = bibleData.books[currentBookIndex];
            const chapter = book.chapters[currentChapterIndex];
            
            chapter.verses.forEach((verse, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `Verse ${verse.number}`;
                verseSelect.appendChild(option);
            });
            
            // Default to first verse
            verseSelect.value = 0;
            currentVerseIndex = 0;
            
            onVerseChange();
        }

        function onVerseChange() {
            const verseSelect = document.getElementById('scriptureVerse');
            currentVerseIndex = parseInt(verseSelect.value);
            
            if (isNaN(currentVerseIndex) || !bibleData) return;
            
            updateScripturePreview();
            updateVerseIndicator();
        }

        function updateScripturePreview() {
            const preview = document.getElementById('scripturePreview');
            const refEl = preview.querySelector('.verse-ref');
            const textEl = preview.querySelector('.verse-text');
            
            if (!bibleData || isNaN(currentBookIndex) || isNaN(currentChapterIndex) || isNaN(currentVerseIndex)) {
                refEl.textContent = 'Select a verse';
                textEl.textContent = 'Choose a book, chapter, and verse to preview';
                return;
            }
            
            const book = bibleData.books[currentBookIndex];
            const chapter = book.chapters[currentChapterIndex];
            const verse = chapter.verses[currentVerseIndex];
            
            refEl.textContent = `${book.englishName} ${chapter.chapter}:${verse.number}`;
            textEl.textContent = verse.text;
        }

        function updateVerseIndicator() {
            const indicator = document.getElementById('verseIndicator');
            if (!bibleData || isNaN(currentBookIndex) || isNaN(currentChapterIndex) || isNaN(currentVerseIndex)) {
                indicator.textContent = '-';
                return;
            }
            
            const book = bibleData.books[currentBookIndex];
            const chapter = book.chapters[currentChapterIndex];
            const verse = chapter.verses[currentVerseIndex];
            indicator.textContent = `${book.book} ${chapter.chapter}:${verse.number}`;
        }

        function previousVerse() {
            if (!bibleData) return;
            
            const book = bibleData.books[currentBookIndex];
            const chapter = book.chapters[currentChapterIndex];
            
            if (currentVerseIndex > 0) {
                currentVerseIndex--;
            } else if (currentChapterIndex > 0) {
                // Go to last verse of previous chapter
                currentChapterIndex--;
                const prevChapter = book.chapters[currentChapterIndex];
                currentVerseIndex = prevChapter.verses.length - 1;
                document.getElementById('scriptureChapter').value = currentChapterIndex;
            } else if (currentBookIndex > 0) {
                // Go to last verse of last chapter of previous book
                currentBookIndex--;
                const prevBook = bibleData.books[currentBookIndex];
                currentChapterIndex = prevBook.chapters.length - 1;
                currentVerseIndex = prevBook.chapters[currentChapterIndex].verses.length - 1;
                
                document.getElementById('scriptureBook').value = currentBookIndex;
                document.getElementById('scriptureChapter').value = currentChapterIndex;
                populateChapterVerses();
            } else {
                return; // At the very beginning
            }
            
            document.getElementById('scriptureVerse').value = currentVerseIndex;
            updateScripturePreview();
            updateVerseIndicator();
            
            // If scripture is currently showing, update it live
            const scriptureBtn = document.getElementById('scriptureToggleBtn');
            if (scriptureBtn.classList.contains('active')) {
                sendScriptureToBroadcast();
            }
        }

        function nextVerse() {
            if (!bibleData) return;
            
            const book = bibleData.books[currentBookIndex];
            const chapter = book.chapters[currentChapterIndex];
            
            if (currentVerseIndex < chapter.verses.length - 1) {
                currentVerseIndex++;
            } else if (currentChapterIndex < book.chapters.length - 1) {
                // Go to first verse of next chapter
                currentChapterIndex++;
                currentVerseIndex = 0;
                document.getElementById('scriptureChapter').value = currentChapterIndex;
            } else if (currentBookIndex < bibleData.books.length - 1) {
                // Go to first verse of first chapter of next book
                currentBookIndex++;
                currentChapterIndex = 0;
                currentVerseIndex = 0;
                
                document.getElementById('scriptureBook').value = currentBookIndex;
                document.getElementById('scriptureChapter').value = currentChapterIndex;
                populateChapterVerses();
            } else {
                return; // At the very end
            }
            
            document.getElementById('scriptureVerse').value = currentVerseIndex;
            updateScripturePreview();
            updateVerseIndicator();
            
            // If scripture is currently showing, update it live
            const scriptureBtn = document.getElementById('scriptureToggleBtn');
            if (scriptureBtn.classList.contains('active')) {
                sendScriptureToBroadcast();
            }
        }

        function populateChapterVerses() {
            const chapterSelect = document.getElementById('scriptureChapter');
            const verseSelect = document.getElementById('scriptureVerse');
            
            chapterSelect.innerHTML = '';
            verseSelect.innerHTML = '';
            
            const book = bibleData.books[currentBookIndex];
            book.chapters.forEach((chapter, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `Chapter ${chapter.chapter}`;
                chapterSelect.appendChild(option);
            });
            
            chapterSelect.value = currentChapterIndex;
            
            const chapter = book.chapters[currentChapterIndex];
            chapter.verses.forEach((verse, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `Verse ${verse.number}`;
                verseSelect.appendChild(option);
            });
            
            verseSelect.value = currentVerseIndex;
        }

        function getCurrentScriptureRef() {
            if (!bibleData) return '';
            const book = bibleData.books[currentBookIndex];
            const chapter = book.chapters[currentChapterIndex];
            const verse = chapter.verses[currentVerseIndex];
            return `${book.englishName} ${chapter.chapter}:${verse.number}`;
        }

        function getCurrentScriptureText() {
            if (!bibleData) return '';
            const book = bibleData.books[currentBookIndex];
            const chapter = book.chapters[currentChapterIndex];
            const verse = chapter.verses[currentVerseIndex];
            return verse.text;
        }

        function sendScriptureToBroadcast() {
            const ref = getCurrentScriptureRef();
            const text = getCurrentScriptureText();
            
            socket.emit('showScripture', {
                ref: ref,
                text: text
            });
        }

        function toggleScripture() {
            const btn = document.getElementById('scriptureToggleBtn');
            const isActive = btn.classList.contains('active');

            if (isActive) {
                socket.emit('hideScripture');
                btn.classList.remove('active');
                btn.textContent = '📖 Show Scripture';
            } else {
                if (!bibleData) {
                    alert('Bible data is still loading. Please wait.');
                    return;
                }
                
                sendScriptureToBroadcast();
                btn.classList.add('active');
                btn.textContent = '📖 Hide Scripture';
            }
        }

        // ========== LOWER THIRD CONTROLS ==========
        function addMessage() {
            const list = document.getElementById('scrollMessagesList');
            const newItem = document.createElement('div');
            newItem.className = 'message-item';
            newItem.innerHTML = `
                <input type="text" value="" placeholder="Enter message...">
                <button class="btn btn-remove btn-sm" onclick="removeMessage(this)">✕</button>
            `;
            list.appendChild(newItem);
        }

        function removeMessage(btn) {
            const item = btn.parentElement;
            if (document.querySelectorAll('.message-item').length > 1) {
                item.remove();
            }
        }

        function getScrollMessages() {
            const inputs = document.querySelectorAll('#scrollMessagesList input');
            return Array.from(inputs).map(input => input.value.trim()).filter(v => v);
        }

        function updateLowerThird() {
            const heading = document.getElementById('ltHeading').value;
            const headline = document.getElementById('ltHeadline').value;
            const scrollMessages = getScrollMessages();

            socket.emit('updateLowerThird', {
                heading: heading,
                headline: headline,
                scrollMessages: scrollMessages
            });

            const toggleBtn = document.getElementById('ltToggleBtn');
            toggleBtn.classList.add('active');
            toggleBtn.textContent = '👁️ Hide';
        }

        function toggleLowerThird() {
            const btn = document.getElementById('ltToggleBtn');
            const isActive = btn.classList.contains('active');

            if (isActive) {
                socket.emit('hideLowerThird');
                btn.classList.remove('active');
                btn.textContent = '👁️ Show';
            } else {
                updateLowerThird();
            }
        }

        // ========== SPEAKER CONTROLS ==========
        function updateSpeakerPreview() {
            const role = document.getElementById('speakerRole').value;
            const name = document.getElementById('speakerName').value;
            
            const preview = document.getElementById('speakerPreview');
            preview.querySelector('.speaker-role').textContent = role || 'NOW MINISTERING';
            preview.querySelector('.speaker-name').textContent = name || 'Speaker Name';
        }

        document.getElementById('speakerRole').addEventListener('input', updateSpeakerPreview);
        document.getElementById('speakerName').addEventListener('input', updateSpeakerPreview);

        function toggleSpeaker() {
            const btn = document.getElementById('speakerToggleBtn');
            const isActive = btn.classList.contains('active');

            if (isActive) {
                socket.emit('hideSpeaker');
                btn.classList.remove('active');
                btn.textContent = '🎤 Show Speaker';
            } else {
                const role = document.getElementById('speakerRole').value;
                const name = document.getElementById('speakerName').value;
                
                socket.emit('showSpeaker', {
                    role: role,
                    name: name
                });

                btn.classList.add('active');
                btn.textContent = '🎤 Hide Speaker';
            }
        }

        // ========== SOCKET EVENT LISTENERS ==========
        socket.on('connect', () => {
            console.log('✅ Connected to broadcast server');
        });

        socket.on('disconnect', () => {
            console.log('🔌 Disconnected from broadcast server');
        });

        socket.on('speakerAutoHidden', () => {
            const btn = document.getElementById('speakerToggleBtn');
            btn.classList.remove('active');
            btn.textContent = '🎤 Show Speaker';
        });

        socket.on('currentState', (state) => {
            console.log('📡 Received current state:', state);
            
            // Update lower third toggle button based on state
            const ltBtn = document.getElementById('ltToggleBtn');
            if (state.lowerThirdToggleState) {
                ltBtn.classList.add('active');
                ltBtn.textContent = '👁️ Hide';
            } else {
                ltBtn.classList.remove('active');
                ltBtn.textContent = '👁️ Show';
            }
        });

        // ========== INITIALIZATION ==========
        loadBibleData();
        updateSpeakerPreview();
        updateVerseIndicator();
    </script>
</body>
</html>
